<!-- Versión: 9th_Design v5.24 (model-viewer local ahora) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#040507">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Menú 3D - Development</title>

  <!-- Google Fonts: Fredoka Variable -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..600&display=swap" 
        rel="stylesheet">

  <!-- Archivo de Contenidos Centralizado -->
  <script src="contents.js"></script>

  <!-- Model Viewer Oficial de Google (Local) -->
<script type="module" 
        src="external/model-viewer.min.js"></script>

  <style>
    /* ==========================================================================
       1. RESET Y VARIABLES GLOBALES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --color-btn: #BA0D36;
      --color-btn-glow: rgba(186, 13, 54, 0.45);
      --color-bg-base: #EEF2F6;
      --color-text-active: #000000;
      --color-text-muted: #1A1D24;
      --font-fredoka: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-webflow: cubic-bezier(0.25, 1, 0.5, 1);
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #040507 !important;
      color: var(--color-text-active);
      font-family: var(--font-fredoka);
      overflow: hidden;
      position: fixed;
      inset: 0;
      color-scheme: dark;
    }

    body.is-ios {
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    /* Bloqueador visual para posición vertical (Landscape Warning) */
    #orientationBlocker {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #040507;
      z-index: 1000005;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: var(--font-fredoka);
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    @media screen and (orientation: landscape) {
      #orientationBlocker {
        display: flex;
      }
    }

    /* ==========================================================================
       2. CONTENEDOR PRINCIPAL (v5.22: Base limpia v5.01 sin clip en Android)
       ========================================================================== */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 30rem;
      height: 100dvh;
      margin: 0 auto;
      overflow-x: hidden;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg-base);
    }

    body.is-ios .app-container {
      overflow-x: clip;
      touch-action: pan-y;
      overscroll-behavior-x: none;
    }

    /* ==========================================================================
       3. ZONA SUPERIOR: VISOR 3D Y BOTÓN AR
       ========================================================================== */
    .viewer-section {
      position: relative;
      z-index: 40;
      width: 100%;
      height: 40dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: radial-gradient(circle at 50% 60%, #171920 0%, #060709 88%);
      border-bottom: 0.0625rem solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 0.25rem 1.25rem rgba(0, 0, 0, 0.18);
    }

    .viewer-slot {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Estilo del visor 3D (v5.22: Restauración de filtros probados y ACES nativo) */
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    body.is-ios model-viewer {
      filter: saturate(0.95) contrast(0.95);
    }

    body:not(.is-ios) model-viewer {
      filter: saturate(0.87) contrast(0.88);
    }

    /* Flechas de navegación (-10% = 36px × 36px, font 23px) */
    .ar-nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-family: sans-serif;
      font-size: 23px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      pointer-events: auto !important;
      outline: none;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }
    .ar-nav-arrow:active {
      background: rgba(255, 255, 255, 0.45);
      transform: translateY(-50%) scale(0.92);
    }

    /* Icono flotante indicador de gestos (v5.22: Animación pausada mientras está oculto) */
    .gesture-hint-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 45;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .gesture-hint-overlay.visible {
      opacity: 1;
    }
    .gesture-hint-overlay:not(.visible) .gesture-hint-icon {
      animation-play-state: paused;
    }
    .gesture-hint-overlay.visible .gesture-hint-icon {
      animation-play-state: running;
    }
    .gesture-hint-icon {
      width: 39px;
      height: 39px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
      animation: gestureSweep 2.2s ease-in-out infinite;
    }
    @keyframes gestureSweep {
      0% { transform: scale(0.92) translateX(-19px) rotate(-7deg); opacity: 0.85; }
      40% { transform: scale(1.0) translateX(0px) rotate(0deg); opacity: 1; }
      70% { transform: scale(0.98) translateX(19px) rotate(7deg); opacity: 0.95; }
      100% { transform: scale(0.92) translateX(-19px) rotate(-7deg); opacity: 0.85; }
    }

    /* Botón "Ver en tu mesa" */
    .btn-ar {
      position: absolute;
      bottom: -1.2rem;
      z-index: 50;
      background-color: var(--color-btn);
      color: #FFFFFF;
      font-family: var(--font-fredoka);
      font-variation-settings: "wdth" 105, "wght" 400;
      font-size: 1.02rem;
      letter-spacing: 0.02rem;
      padding: 0.7rem 1.75rem;
      border-radius: 0.65rem;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0.25rem 1.125rem var(--color-btn-glow);
      transition: transform 0.15s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ar span {
      display: inline-block;
      transform: translateY(-0.125rem);
    }

    .btn-ar:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }

    /* ==========================================================================
       4. ZONA INFERIOR: CERÁMICA 3D (3 CAPAS CON +5% ESCALA Y LUZ A 225°)
       ========================================================================== */
    .menu-section {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      overflow: hidden;
      padding-top: 1.5rem;
      background: radial-gradient(circle at 50% 45%, #F8FAFC 0%, #E2E8EE 100%);
    }

    /* Escenario cinético */
    .ceramic-viewport {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* Capas cerámicas con caída continua y luz a 90° */
    .ceramic-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      transform: translate(-50%, -50%) rotate(225deg) scale(1);
      will-change: transform;
      background: linear-gradient(
        90deg, 
        #CCD6E0 0%, 
        #DCE4EC 25%, 
        #E8EFF5 50%, 
        #F5F8FA 78%, 
        #FFFFFF 100%
      );
    }

    /* CAPA 1: Terraza central (+5% escala: 16.73rem × 12.53rem) */
    .layer-1 {
      width: 16.734rem;
      height: 12.534rem;
      border-radius: 2.8875rem;
      z-index: 5;
      box-shadow: 
        0.5rem 0.875rem 1.5rem rgba(18, 25, 40, 0.08),
        0.125rem 0.25rem 0.5rem rgba(18, 25, 40, 0.03),
        inset -0.75rem -0.75rem 2rem rgba(255, 255, 255, 0.90),
        inset 0.75rem 0.75rem 2rem rgba(165, 180, 198, 0.35);
    }

    /* CAPA 2: Terraza 1 (+5% escala: 22.51rem × 18.375rem) */
    .layer-2 {
      width: 22.51rem;
      height: 18.375rem;
      border-radius: 5.25rem;
      z-index: 4;
      box-shadow: 
        0.75rem 1.125rem 1.875rem rgba(18, 25, 40, 0.065),
        0.1875rem 0.3125rem 0.625rem rgba(18, 25, 40, 0.025),
        inset -1rem -1rem 2.5rem rgba(255, 255, 255, 0.85),
        inset 1rem 1rem 2.5rem rgba(165, 180, 198, 0.30);
    }

    /* CAPA 3: Terraza 2 (+5% escala: 28.35rem × 24.15rem) */
    .layer-3 {
      width: 28.35rem;
      height: 24.15rem;
      border-radius: 8.1375rem;
      z-index: 3;
      box-shadow: 
        1rem 1.5rem 2.375rem rgba(18, 25, 40, 0.05),
        0.25rem 0.4375rem 0.875rem rgba(18, 25, 40, 0.02),
        inset -1.25rem -1.25rem 3rem rgba(255, 255, 255, 0.80),
        inset 1.25rem 1.25rem 3rem rgba(165, 180, 198, 0.25);
    }

    /* Fades de scroll */
    .fade-top, .fade-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 2.75rem;
      z-index: 25;
      pointer-events: none;
    }

    .fade-top {
      top: 0;
      background: linear-gradient(
        to bottom, 
        rgba(248, 250, 252, 0.95) 15%, 
        rgba(248, 250, 252, 0) 100%
      );
    }

    .fade-bottom {
      bottom: 0;
      background: linear-gradient(
        to top, 
        rgba(226, 232, 238, 0.95) 20%, 
        rgba(226, 232, 238, 0) 100%
      );
    }

    /* ==========================================================================
       5. LISTA DE PLATOS Y CARD FLUIDA (v5.22: blur a 3px optimizado)
       ========================================================================== */
    .menu-list {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      list-style: none;
      padding: 0.8rem 0 0.8rem 0;
      scrollbar-width: none;
    }

    body.is-ios .menu-list {
      overflow-x: clip;
      touch-action: pan-y;
      overscroll-behavior-x: none;
    }

    .menu-list::-webkit-scrollbar {
      display: none;
    }

    /* Inyección dinámica matemática de altura (INMUTABLE) */
    .menu-list.has-expanded {
      padding-bottom: calc(60dvh - 3.25rem) !important;
    }

    /* FILA BASE */
    .menu-item {
      position: relative;
      width: 100%;
      height: 3.25rem;
      cursor: pointer;
      z-index: 10;
      margin: 0;
      transition: height 0.38s var(--ease-webflow);
    }

    /* CARD EXPANDIDA */
    .menu-item.expanded {
      height: 14.8rem;
      z-index: 30;
      margin: 0;
    }

    /* 1. SOMBRA AMBIENTAL (CONTRACCIÓN HORIZONTAL INSTANTÁNEA 0.06s) */
    .glass-shadow {
      position: absolute;
      left: 2rem;
      right: 0;
      top: 0;
      bottom: 0;
      border-radius: 0;
      opacity: 0;
      pointer-events: none;
      box-shadow: 
        0 0.875rem 1.75rem rgba(18, 25, 40, 0.12),
        0 0.25rem 0.625rem rgba(18, 25, 40, 0.06);
      transition: opacity 0.35s var(--ease-webflow), 
                  right 0.06s ease-out, 
                  border-radius 0.06s ease-out;
      z-index: 2;
    }

    .menu-item.active .glass-shadow {
      opacity: 1;
    }

    .menu-item.expanded .glass-shadow {
      left: 2rem;
      right: 2rem;
      border-radius: 0.875rem;
      box-shadow: 
        0 1.125rem 2.25rem rgba(18, 25, 40, 0.14),
        0 0.375rem 0.875rem rgba(18, 25, 40, 0.08);
    }

    /* 2. CÁUSTICA 1 (EXTERIOR): GRADIENTE ALFA PURO */
    .caustic-bg {
      position: absolute;
      right: 1.5rem;
      bottom: -0.75rem;
      width: 8.5rem;
      height: 1.6rem;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 50% 50%, 
        rgba(255, 255, 255, 0.95) 0%, 
        rgba(255, 255, 255, 0.60) 30%, 
        rgba(255, 255, 255, 0.18) 60%, 
        transparent 80%
      );
      filter: blur(0.15rem);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-webflow), 
                  transform 0.35s var(--ease-webflow);
      z-index: 4;
    }

    .menu-item.active .caustic-bg {
      opacity: 1;
      transform: translateY(0.0625rem) scale(1.10);
    }

    .menu-item.expanded .caustic-bg {
      right: 3.2rem;
      bottom: -0.5rem;
    }

    /* 3. CRISTAL LÍQUIDO (v5.22: BLUR A 3px COMO EN v5.01) */
    .glass-overlay {
      position: absolute;
      left: 2rem;
      right: 0;
      top: 0;
      bottom: 0;
      border-radius: 0;
      background: linear-gradient(
        90deg, 
        rgba(255, 255, 255, 0.40) 0%, 
        rgba(255, 255, 255, 0.18) 55%, 
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      box-shadow: 
        0 0.5rem 1.5rem rgba(18, 25, 40, 0.06),
        inset 0.09375rem 0.125rem 0.1875rem rgba(255, 255, 255, 0.92),
        inset -0.09375rem -0.125rem 0.25rem rgba(18, 25, 40, 0.04);
      transition: opacity 0.35s var(--ease-webflow), 
                  right 0.06s ease-out, 
                  border-radius 0.06s ease-out;
      z-index: 5;
    }

    .menu-item.active .glass-overlay {
      opacity: 1;
    }

    .menu-item.expanded .glass-overlay {
      left: 2rem;
      right: 2rem;
      border-radius: 0.875rem;
    }

    /* 4. CÁUSTICA 2 (INTERIOR): GRADIENTE ALFA PURO */
    .caustic-glass {
      position: absolute;
      right: 1.5rem;
      bottom: 0.3rem;
      width: 8rem;
      height: 1.4rem;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 50% 50%, 
        rgba(255, 255, 255, 0.85) 0%, 
        rgba(255, 255, 255, 0.45) 35%, 
        rgba(255, 255, 255, 0.12) 65%, 
        transparent 85%
      );
      filter: blur(0.12rem);
      opacity: 0.95;
      pointer-events: none;
    }

    /* ESPECULARES */
    .specular-top, .specular-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 0.0625rem;
      transform: scaleY(0.5);
      pointer-events: none;
    }

    .specular-top {
      top: 0;
      background: linear-gradient(
        90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.95) 35%, 
        rgba(0, 0, 0, 0.05) 70%, 
        transparent 100%
      );
    }

    .specular-bottom {
      bottom: 0;
      background: linear-gradient(
        90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.90) 35%, 
        rgba(0, 0, 0, 0.04) 70%, 
        transparent 100%
      );
    }

    /* LÍNEA ROJA: SALIDA INSTANTÁNEA (0.06s) AL EXPANDIR */
    .red-indicator {
      position: absolute;
      left: 1.65rem;
      top: 0;
      height: 3.25rem;
      width: 0.29375rem;
      background-color: var(--color-btn);
      box-shadow: 0 0 0.625rem rgba(186, 13, 54, 0.45);
      opacity: 0;
      transition: opacity 0.18s ease-out;
      z-index: 15;
    }

    .menu-item.active .red-indicator {
      opacity: 1;
    }

    .menu-item.expanded .red-indicator {
      opacity: 0 !important;
      transition: opacity 0.06s ease-out;
    }

    /* ESTRUCTURA INTERIOR */
    .item-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* CABECERA */
    .item-header {
      position: relative;
      height: 3.25rem;
      min-height: 3.25rem;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      transition: transform 0.35s var(--ease-webflow);
    }

    .menu-item.active .item-header,
    .menu-item.expanded .item-header {
      transform: translateX(2.4rem);
    }

    /* Número */
    .item-number {
      font-size: 0.68rem;
      font-variation-settings: "wdth" 100, "wght" 300;
      color: var(--color-text-muted);
      margin-right: 1.1rem;
      letter-spacing: 0.03125rem;
      width: 1.4rem;
      opacity: 0.40;
      transition: opacity 0.35s var(--ease-webflow), 
                  color 0.35s var(--ease-webflow);
    }

    .menu-item.active .item-number {
      opacity: 0.75;
      color: var(--color-text-active);
    }

    /* Nombre */
    .item-name {
      font-size: 1.0rem;
      line-height: 1.2;
      font-variation-settings: "wdth" 125, "wght" 400;
      letter-spacing: 0.02rem;
      color: var(--color-text-muted);
      opacity: 0.60;
      flex: 1;
      transition: 
        opacity 0.35s var(--ease-webflow),
        color 0.35s var(--ease-webflow),
        font-variation-settings 0.35s var(--ease-webflow),
        text-shadow 0.35s var(--ease-webflow);
    }

    .menu-item.active .item-name {
      opacity: 1;
      color: var(--color-text-active);
      font-variation-settings: "wdth" 125, "wght" 500;
      text-shadow: 0 0.0625rem 0.125rem rgba(255, 255, 255, 0.8);
    }

    /* ZONA DERECHA: HAMBURGUESA */
    .item-meta {
      position: absolute;
      right: 2.4rem;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem;
    }

    /* ICONO "MÁS INFO" (ANIMACIÓN SIMÉTRICA REVERSIBLE EN 0.18s) */
    .more-info-icon {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.22rem;
      width: 1.4rem;
      height: 1.4rem;
      opacity: 0;
      pointer-events: none;
      transform: scale(1);
      transition: opacity 0.18s var(--ease-webflow), 
                  transform 0.18s var(--ease-webflow);
    }

    .more-info-icon .bar {
      width: 0.9375rem;
      height: 0.15rem;
      background-color: rgba(0, 0, 0, 0.70);
      border-radius: 0.125rem;
    }

    .menu-item.active .more-info-icon {
      opacity: 0.80;
      transform: scale(1);
    }

    .menu-item.expanded .more-info-icon {
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.18s var(--ease-webflow), 
                  transform 0.18s var(--ease-webflow);
    }

    /* CUERPO DEL CARD */
    .card-body {
      position: relative;
      padding: 0.2rem 2.8rem 1.4rem 3.9rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-0.25rem);
      transition: opacity 0.16s ease-out 0s, 
                  transform 0.16s ease-out 0s;
    }

    .menu-item.expanded .card-body {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition: opacity 0.18s ease-out 0.18s, 
                  transform 0.18s ease-out 0.18s;
    }

    /* CONTENEDOR DE SCROLL */
    .card-scroll-container {
      position: relative;
      width: 100%;
      height: 8.8rem;
    }

    /* Fade superior recortado a la mitad de altura (~6% arriba frente a 28% abajo) */
    .card-scroll-wrap {
      height: 100%;
      overflow-y: auto;
      padding-right: 1.6rem;
      padding-bottom: 2.6rem;
      -webkit-mask-image: linear-gradient(
        to bottom, 
        transparent 0%, 
        black 6%, 
        black 72%, 
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom, 
        transparent 0%, 
        black 6%, 
        black 72%, 
        transparent 100%
      );
      scrollbar-width: none;
    }

    .card-scroll-wrap::-webkit-scrollbar {
      display: none;
    }

    /* PISTA CON LÍNEA GUÍA OSCURA */
    .card-scroll-track {
      position: absolute;
      right: 0.3rem;
      top: 0.2rem;
      bottom: 2.6rem;
      width: 0.6rem;
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
    }

    .card-scroll-track::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0.10rem;
      background-color: rgba(0, 0, 0, 0.14);
      border-radius: 0.05rem;
    }

    /* Bolita con área táctil ampliada (~36px) mediante pseudo-elemento */
    .card-scroll-dot {
      width: 0.58rem;
      height: 0.58rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 
        0 0.0625rem 0.3rem rgba(0, 0, 0, 0.45),
        inset 0 0 0.0625rem rgba(255, 255, 255, 0.95);
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, 0);
      will-change: transform;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
    }

    .card-scroll-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
    }

    /* TEXTO DESCRIPTIVO */
    .card-text {
      font-size: 0.92rem;
      line-height: 1.54;
      letter-spacing: 0.0125rem;
      color: #1A1D24;
      font-variation-settings: "wdth" 105, "wght" 400;
      text-shadow: 0 0.0625rem 0.0625rem rgba(255, 255, 255, 0.85);
      max-width: 86%;
    }

    /* PRECIO */
    .card-price {
      position: absolute;
      right: 3.2rem;
      bottom: calc(1.2rem - 10px);
      font-size: 2.10rem;
      font-family: var(--font-fredoka);
      font-variation-settings: "wdth" 105, "wght" 300;
      color: #000000;
      letter-spacing: 0.02rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0.2rem);
      transition: opacity 0.18s ease-out 0s, 
                  transform 0.18s ease-out 0s;
      z-index: 25;
    }

    .menu-item.expanded .card-price {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.18s ease-out 0.20s, 
                  transform 0.18s ease-out 0.20s;
    }
  </style>
</head>
<body>

  <!-- Bloqueador visual para posición vertical (Landscape Warning) -->
  <div id="orientationBlocker">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" 
         stroke="currentColor" stroke-width="2" stroke-linecap="round" 
         stroke-linejoin="round" style="margin-bottom:16px;">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
      <path d="M17 6h2a2 2 0 0 1 2 2v2"></path>
      <path d="M7 6H5a2 2 0 0 0-2 2v2"></path>
    </svg>
    <div style="font-size:18px; font-weight:bold; margin-bottom:8px;">Gira tu dispositivo</div>
    <div style="font-size:14px; opacity:0.8;">Por favor, coloca el teléfono en posición vertical para continuar.</div>
  </div>

  <main class="app-container">

    <!-- ZONA SUPERIOR: Visor 3D dinámico + Botón AR + Flechas AR -->
    <section class="viewer-section" id="viewerSection">
      
      <!-- Flechas de navegación (-10% escala = 36px) -->
      <button id="prevDishBtn" class="ar-nav-arrow" style="left:12px;" aria-label="Plato anterior">&#8249;</button>
      <button id="nextDishBtn" class="ar-nav-arrow" style="right:12px;" aria-label="Plato siguiente">&#8250;</button>

      <!-- Slot dinámico para model-viewer -->
      <div class="viewer-slot" id="viewerSlot"></div>

      <!-- Icono flotante con animación de barrido (-15% escala = 39px) -->
      <div class="gesture-hint-overlay" id="gestureHint">
        <svg viewBox="0 0 48 48" fill="none" class="gesture-hint-icon">
          <path d="M19 16V9a3 3 0 0 1 6 0v12" stroke="#FFFFFF" stroke-width="2.5" 
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 19a3 3 0 0 1 6 0v2" stroke="#FFFFFF" stroke-width="2.5" 
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31 20a3 3 0 0 1 6 0v4c0 7-5 13-12 13s-11-5-11-10v-5a3 3 0 0 1 6 0v-2" 
                stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 28a16 16 0 0 1 24 0" stroke="#00e5ff" stroke-width="2" 
                stroke-linecap="round" stroke-dasharray="2 3" opacity="0.85"/>
        </svg>
      </div>

      <button type="button" class="btn-ar" id="btn-ar"><span>Ver en tu mesa</span></button>
    </section>

    <!-- ZONA INFERIOR: Topografía Cerámica 3D (3 Capas al +5%) y Menú -->
    <section class="menu-section">
      
      <!-- 3 Terrazas de Cerámica Concéntricas -->
      <div class="ceramic-viewport" id="ceramic-viewport">
        <div class="ceramic-layer layer-3"></div>
        <div class="ceramic-layer layer-2"></div>
        <div class="ceramic-layer layer-1"></div>
      </div>

      <!-- Fades de scroll superior e inferior -->
      <div class="fade-top"></div>
      <div class="fade-bottom"></div>

      <!-- Lista dinámica de platos inyectada automáticamente desde contents.js -->
      <ul class="menu-list" id="menu-list"></ul>
    </section>

  </main>
